name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-ci:
    name: Frontend CI (Lint, Build, Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run TypeScript & Production Build
        run: npm run build

      - name: Run Vitest Unit & Component Tests
        run: npm run test

  backend-ci:
    name: Backend CI (MySQL 8.4, Unit/Integration Tests & JaCoCo)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ToeicDictation@2026!
          MYSQL_DATABASE: toeic_dictation
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -u root -pToeicDictation@2026!" --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Eclipse Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Initialize Database Schema & Seed Data
        run: |
          mysql -h 127.0.0.1 -u root -pToeicDictation@2026! toeic_dictation < database/schema.sql
          mysql -h 127.0.0.1 -u root -pToeicDictation@2026! toeic_dictation < database/seed_data.sql

      - name: Make Maven Wrapper Executable
        run: chmod +x backend/mvnw

      - name: Run Backend Tests with JaCoCo Coverage Report
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/toeic_dictation?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ToeicDictation@2026!
        run: ./mvnw clean test jacoco:report

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 14
